name: CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'client/**'
      - '.github/workflows/ci.yml'
  # Reused by release.yml before deploying.
  workflow_call:

permissions:
  contents: read

# A new push to a PR cancels its previous run. Runs called by release.yml are
# grouped by commit, so they never cancel a deploy.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  ci:
    name: Type check, lint, format, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint:all

      - name: Check formatting
        run: npm run format:check:all

      - name: Run tests
        run: npx vitest run

      - name: Build
        run: npm run build
