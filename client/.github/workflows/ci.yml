name: CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "src/**"

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  ci:
    runs-on: ubuntu-latest
    name: Lint, format and tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Get changed files
        id: changed-files
        run: |
          FILES=$(git diff --name-only --diff-filter=ACMRT origin/${{ github.base_ref }}...HEAD | grep -E '\.(js|jsx|ts|tsx|json|md|mdx)$' || true)
          SOURCE_FILES=$(git diff --name-only --diff-filter=ACMRT origin/${{ github.base_ref }}...HEAD | grep -E '\.(js|jsx|ts|tsx)$' || true)
          TEST_FILES=$(echo "$SOURCE_FILES" | grep -E '^src/' || true)

          echo "files=$(echo $FILES | xargs)" >> $GITHUB_OUTPUT
          echo "source_files=$(echo $SOURCE_FILES | xargs)" >> $GITHUB_OUTPUT
          echo "should_test=$([ -n "$TEST_FILES" ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

      - name: Run Format
        if: steps.changed-files.outputs.files != ''
        id: format
        run: npm run format:check -- ${{ steps.changed-files.outputs.files }}
        continue-on-error: true

      - name: Run ESLint
        if: steps.changed-files.outputs.source_files != ''
        id: lint
        run: npm run lint -- ${{ steps.changed-files.outputs.source_files }}

      - name: Run tests
        if: steps.changed-files.outputs.should_test == 'true'
        id: tests
        working-directory: src/
        run: npm run test:workflow:local -- $(git diff --name-only origin/${{ github.base_ref }}...HEAD)

      - name: Build project
        run: npm run build

      - name: Deploy preview to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=yoko

      - name: Comment preview URL on PR
        if: ${{ steps.deploy.outputs.deployment-url != '' }}
        uses: actions/github-script@v7
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: `✅ Preview deployed: ${process.env.DEPLOY_URL}`
              })

      - name: Check for failures
        if: always()
        run: |
          if [[ "${{ steps.format.outcome }}" == "failure" || "${{ steps.lint.outcome }}" == "failure" || "${{ steps.tests.outcome }}" == "failure" ]]; then
            echo "## ❌ CI falhou" >> $GITHUB_STEP_SUMMARY
            echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| Format | ${{ steps.format.outcome == 'failure' && '❌' || '✅' }} |" >> $GITHUB_STEP_SUMMARY
            echo "| ESLint | ${{ steps.lint.outcome == 'failure' && '❌' || '✅' }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Tests | ${{ steps.tests.outcome == 'failure' && '❌' || '✅' }} |" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
