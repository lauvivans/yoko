<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Yoko — Occurrences</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
  <!--
    Mirrors the real app styles from client/src/assets/sass
    (main.scss, _header.scss, _footer.scss, pages/occurrence,
    components/action/_list-toolbar.scss) and uses the original mascot and icons.
  -->
  <style>
    /* reset.scss */
    *,*::before,*::after{box-sizing:border-box}
    *{margin:0}
    body{line-height:1.5;-webkit-font-smoothing:antialiased}
    img,svg{display:block;max-width:100%}
    button,input{font:inherit}

    /* main.scss */
    :root{color:#262626;font-family:'Quicksand',sans-serif;font-weight:400;font-size:16px;line-height:1.5;--aside-size:50px}
    body{max-width:1800px;min-height:100vh;margin:0 auto;background:#fff}
    #root{position:relative;height:100vh;width:100%}

    .app{display:flex;flex-direction:column;height:100%;width:100%;overflow:hidden;position:relative}
    .app__main-wrapper{height:100%;width:100%}
    .app__main-wrapper > img{position:absolute;bottom:-10px;width:200px;right:0;z-index:90}
    @media (min-width:481px){.app__main-wrapper > img{bottom:-85px;width:300px}}

    .app__outlet-wrapper{display:flex;flex:1;height:100%;width:100%}

    .app__aside{display:flex;flex-direction:column;height:100%;width:var(--aside-size);flex-shrink:0;padding:20px 0;background-color:#f8f8f8}
    .app__aside ul{display:flex;flex-direction:column;align-items:center;row-gap:5px;list-style:none;padding:0}
    .app__aside li{display:block;cursor:pointer;padding:5px}
    .app__aside li:hover{background-color:#fff;border-radius:10px}
    .app__aside li img{width:30px;height:30px}
    .app__aside a,.app__aside button{all:unset;display:block;cursor:pointer}
    .app__aside a svg,.app__aside button svg{width:28px;height:28px}
    .app__aside__top{margin-bottom:auto}
    .app__aside__bottom{margin-top:auto}

    .app__main{display:flex;flex-direction:column;height:100%;width:100%}
    .app__outlet{min-height:0;height:100%;width:100%;margin:5px 5px 0 0;overflow-y:auto;background-color:rgba(248,248,248,.3);border-radius:10px}

    /* _header.scss */
    .c-header{display:flex;max-width:max-content;column-gap:20px;padding:5px 15px;align-items:center;flex-shrink:0;background-color:#fff;border:1px solid rgba(255,97,94,.1);border-radius:24px;box-shadow:0 4px 7px 5px rgba(0,0,0,.1);right:30px;top:20px;z-index:1800;position:absolute;user-select:none;cursor:grab}
    .c-header:active{cursor:grabbing}
    .c-header__period{font-size:16px;font-weight:600}
    .c-header__right-side{display:flex;align-items:center}
    .c-header__right-side button{all:unset;padding:7px;cursor:pointer;border-radius:10px}
    .c-header__right-side button:hover{background-color:#f8f8f8}
    .c-header__right-side svg{width:25px;height:25px}

    /* _footer.scss */
    .c-footer{display:flex;flex-wrap:wrap;flex-shrink:0;background-color:#fff;padding:5px 30px;justify-content:space-between;align-items:flex-end;z-index:100}
    .c-footer__copyright{position:relative}
    .c-footer__copyright > div{position:absolute;top:-10px;left:30px}
    .c-footer__copyright img{width:19px;height:19px}
    .c-footer__version{align-self:center}
    .c-footer__data{display:flex;flex-direction:column;row-gap:2px}
    .c-footer__data span{font-size:14px}

    /* pages/occurrence/_index.scss */
    .p-occurrence{display:flex;column-gap:10px;position:relative;flex:1;height:100%}
    .p-occurrence__aside{display:flex;flex-direction:column;height:calc(100% - 140px);position:fixed;width:70px}
    .p-occurrence__tabs{display:flex;flex-direction:column;row-gap:10px;padding:10px}
    .p-occurrence__tabs svg{width:25px;height:25px}
    .p-occurrence__tab{all:unset;border:1px solid #1a1a1a;padding:5px 10px;border-radius:10px;cursor:pointer;transition:background-color .5s;background-color:#f8f8f8}
    .p-occurrence__tab--active,.p-occurrence__tab:hover{background-color:rgba(181,224,255,.7)}
    .p-occurrence__content{display:flex;flex:1;height:100%;margin-left:70px}

    .c-events-view{display:flex;flex-direction:column;padding:10px 10px 0 0;flex:1}
    .c-events-view__cards{display:grid;gap:15px;padding-bottom:120px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
    .c-events-view__tools{display:flex;justify-content:space-between;margin-bottom:20px}
    .c-events-view__add-btn{all:unset;display:flex;justify-content:center;align-items:center;border-radius:10px;background-color:#f8f8f8;cursor:pointer;padding:5px 10px}
    .c-events-view__add-btn:hover{background-color:rgba(248,248,248,.7)}
    .c-events-view__add-btn svg{height:25px;width:25px}

    /* components/action/_list-toolbar.scss */
    .c-list-toolbar{display:flex;column-gap:10px;position:relative;flex:1}
    .c-list-toolbar__item-wrapper,.c-list-toolbar__item{display:flex}
    .c-list-toolbar__btn{all:unset;flex:1;display:flex;column-gap:5px;align-items:center;background-color:#f8f8f8;cursor:pointer;padding:10px 15px;border-radius:10px}
    .c-list-toolbar__btn svg{width:19px;height:19px}
    .c-list-toolbar__btn:hover{background-color:rgba(248,248,248,.7)}

    /* pages/occurrence/components/_occurrence-card.scss */
    .c-occurrence-card-wrapper{position:relative}
    .c-occurrence-card{position:relative;display:flex;padding:12px;border-radius:10px;border:1px solid #1a1a1a;height:100%;cursor:pointer}
    .c-occurrence-card--Personal{background-color:#ccf0ec}
    .c-occurrence-card--Social{background-color:#edccf0}
    .c-occurrence-card:hover .c-occurrence-card__checkbox{display:block}
    .c-occurrence-card__checkbox{display:none;position:absolute;top:5px;right:5px}
    .c-occurrence-card__checkbox:has(input:checked){display:flex}
    .c-occurrence-card__checkbox:has(input:checked)::after{content:'✓';position:absolute;top:50%;left:50%;color:#f8f8f8;font-size:14px;font-weight:700;line-height:1;pointer-events:none;transform:translate(-50%,-50%)}
    .c-occurrence-card__checkbox input{appearance:none;-webkit-appearance:none;width:20px;height:20px;margin:0;border:1px solid #1a1a1a;border-radius:5px;background-color:#f8f8f8;outline:none;cursor:pointer;transition:background-color .2s,border-color .2s}
    .c-occurrence-card__checkbox input:hover{background-color:rgba(248,248,248,.7)}
    .c-occurrence-card__checkbox input:focus-visible{box-shadow:0 0 0 2px #fff,0 0 0 4px #1a1a1a}
    .c-occurrence-card__checkbox input:checked{border-color:#1a1a1a;background-color:#1a1a1a}
    .c-occurrence-card:has(.c-occurrence-card__checkbox input:checked){border-width:2px}
    .c-occurrence-card__category-icon{position:absolute;bottom:0;right:20px;opacity:.8}
    .c-occurrence-card__category-icon svg{width:30px;height:30px}
    .c-occurrence-card__content{display:flex;flex-direction:column;flex:1}
    .c-occurrence-card__countdown{margin-top:auto}
    .c-occurrence-card__countdown--highlight{font-size:20px;font-weight:600;line-height:1.5}
    .c-occurrence-card__title{font-size:16px;font-weight:600;line-height:1.5;overflow-wrap:break-word;word-break:break-word;white-space:pre-wrap;width:fit-content}
    .c-occurrence-card__datetime{display:flex;flex-direction:column;font-size:14px;font-weight:400;line-height:1.5;margin-top:10px;margin-bottom:20px;max-width:fit-content}
    .c-occurrence-card__time{font-size:13px}
  </style>
</head>
<body>
  <div id="root">
    <div class="app light">
      <header class="c-header">
        <div><span class="c-header__period">Good morning</span></div>
        <div class="c-header__right-side">
          <button type="button" aria-label="Open mood selector" title="Mood selector">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><g stroke="#292D32" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M9 22h6c5 0 7-2 7-7V9c0-5-2-7-7-7H9C4 2 2 4 2 9v6c0 5 2 7 7 7Z"/><path stroke-miterlimit="10" d="M15.5 9.75a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3ZM8.5 9.75a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3ZM8.4 13.3h7.2c.5 0 .9.4.9.9 0 2.49-2.01 4.5-4.5 4.5s-4.5-2.01-4.5-4.5c0-.5.4-.9.9-.9Z"/></g></svg>
          </button>
          <button type="button" aria-label="Search" title="Search">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><g stroke="#292D32" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M11.5 21a9.5 9.5 0 1 0 0-19 9.5 9.5 0 0 0 0 19ZM22 22l-2-2"/></g></svg>
          </button>
        </div>
      </header>

      <div class="app__main-wrapper">
        <div class="app__outlet-wrapper">
          <aside class="app__aside">
            <ul class="app__aside__top">
              <li title="Home"><a href="home.html"><img src="../../public/mascot.svg" alt="Yoko"></a></li>
              <li title="Theme">
                <button type="button" aria-label="Switch theme">
                  <svg viewBox="0 0 24 24" fill="none"><path d="M12 18.5C15.5899 18.5 18.5 15.5899 18.5 12C18.5 8.41015 15.5899 5.5 12 5.5C8.41015 5.5 5.5 8.41015 5.5 12C5.5 15.5899 8.41015 18.5 12 18.5Z" stroke="#292D32" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M19.14 19.14L19.01 19.01M19.01 4.99L19.14 4.86L19.01 4.99ZM4.86 19.14L4.99 19.01L4.86 19.14ZM12 2.08V2V2.08ZM12 22V21.92V22ZM2.08 12H2H2.08ZM22 12H21.92H22ZM4.99 4.99L4.86 4.86L4.99 4.99Z" stroke="#292D32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
              </li>
            </ul>
            <ul class="app__aside__middle">
              <li title="Occurrences"><a href="occurrences-events.html" aria-label="Go to occurrences">
                <svg viewBox="0 0 24 24" fill="none"><path d="M22 12C22 17.52 17.52 22 12 22C6.48 22 2 17.52 2 12C2 6.48 6.48 2 12 2C17.52 2 22 6.48 22 12Z" stroke="#292D32" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M15.71 15.18L12.61 13.33C12.07 13.01 11.63 12.24 11.63 11.61V7.51001" stroke="#292D32" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </a></li>
              <li title="Notes"><a href="#" aria-label="Go to notes">
                <svg viewBox="0 0 24 24" fill="none"><g stroke="#292D32" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.6601 10.44L20.6801 14.62C19.8401 18.23 18.1801 19.69 15.0601 19.39C14.5601 19.35 14.0201 19.26 13.4401 19.12L11.7601 18.72C7.59006 17.73 6.30006 15.67 7.28006 11.49L8.26006 7.30001C8.46006 6.45001 8.70006 5.71001 9.00006 5.10001C10.1701 2.68001 12.1601 2.03001 15.5001 2.82001L17.1701 3.21001C21.3601 4.19001 22.6401 6.26001 21.6601 10.44Z"/><path d="M15.06 19.39C14.44 19.81 13.66 20.16 12.71 20.47L11.13 20.99C7.15998 22.27 5.06997 21.2 3.77997 17.23L2.49997 13.28C1.21997 9.30998 2.27997 7.20998 6.24997 5.92998L7.82997 5.40998C8.23997 5.27998 8.62997 5.16998 8.99997 5.09998C8.69997 5.70998 8.45997 6.44998 8.25997 7.29998L7.27997 11.49C6.29997 15.67 7.58998 17.73 11.76 18.72L13.44 19.12C14.02 19.26 14.56 19.35 15.06 19.39Z"/><path d="M12.64 8.53003L17.49 9.76003"/><path d="M11.66 12.4L14.56 13.14"/></g></svg>
              </a></li>
              <li title="Tasks"><a href="#" aria-label="Go to tasks">
                <svg viewBox="0 0 24 24" fill="none"><g stroke="#292D32" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12.37 8.87988H17.62"/><path d="M6.38 8.87988L7.13 9.62988L9.38 7.37988"/><path d="M12.37 15.8799H17.62"/><path d="M6.38 15.8799L7.13 16.6299L9.38 14.3799"/><path d="M9 22H15C20 22 22 20 22 15V9C22 4 20 2 15 2H9C4 2 2 4 2 9V15C2 20 4 22 9 22Z"/></g></svg>
              </a></li>
              <li title="Mood history"><a href="#" aria-label="Go to mood history">
                <svg viewBox="0 0 24 24" fill="none"><g stroke="#292D32" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M14 6.2V10c-2.79.05-3.95 1.21-4 4H6.2C3.2 14 2 12.8 2 9.8V6.2C2 3.2 3.2 2 6.2 2h3.6c3 0 4.2 1.2 4.2 4.2Z"/><path stroke-miterlimit="10" d="M6.96 5.87c-.53-.36-1.23-.36-1.76.02M10.96 5.87c-.53-.36-1.23-.36-1.76.02M8.16 11.42H5.84c-.3 0-.54-.24-.54-.54 0-1.49 1.21-2.7 2.7-2.7.64 0 1.23.22 1.69.59"/><path d="M22 14.2v3.6c0 3-1.2 4.2-4.2 4.2h-3.6c-3 0-4.2-1.2-4.2-4.2V14c.05-2.79 1.21-3.95 4-4h3.8c3 0 4.2 1.2 4.2 4.2Z"/><path stroke-miterlimit="10" d="M14.96 13.62c-.53.36-1.23.36-1.76-.02M18.96 13.62c-.53.36-1.23.36-1.76-.02M13.84 16.18h4.32c.3 0 .54.24.54.54 0 1.49-1.21 2.7-2.7 2.7-1.49 0-2.7-1.21-2.7-2.7 0-.3.24-.54.54-.54Z"/></g></svg>
              </a></li>
            </ul>
            <ul class="app__aside__bottom">
              <li title="Sign in">
                <button type="button" aria-label="Sign in">
                  <svg viewBox="0 0 24 24" fill="none"><g stroke="#292D32" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8.90002 7.55999C9.21002 3.95999 11.06 2.48999 15.11 2.48999H15.24C19.71 2.48999 21.5 4.27999 21.5 8.74999V15.27C21.5 19.74 19.71 21.53 15.24 21.53H15.11C11.09 21.53 9.24002 20.08 8.91002 16.54"/><path d="M2 12H14.88"/><path d="M12.65 8.6499L16 11.9999L12.65 15.3499"/></g></svg>
                </button>
              </li>
            </ul>
          </aside>

          <div class="app__main">
            <div class="app__outlet">
              <main class="p-occurrence">
                <div class="p-occurrence__aside">
                  <div class="p-occurrence__tabs">
                    <button class="p-occurrence__tab p-occurrence__tab--active" title="Events" aria-label="Go to events view">
                      <svg viewBox="0 0 24 24" fill="none"><path d="M22 12C22 17.52 17.52 22 12 22C6.48 22 2 17.52 2 12C2 6.48 6.48 2 12 2C17.52 2 22 6.48 22 12Z" stroke="#292D32" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M15.71 15.18L12.61 13.33C12.07 13.01 11.63 12.24 11.63 11.61V7.51001" stroke="#292D32" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                    <button class="p-occurrence__tab" title="Calendar" aria-label="Go to calendar view">
                      <svg viewBox="0 0 24 24" fill="none"><g stroke="#292D32" stroke-linecap="round" stroke-linejoin="round"><path stroke-miterlimit="10" stroke-width="1.5" d="M8 2v3"/><path stroke-miterlimit="10" stroke-width="1.5" d="M16 2v3"/><path stroke-miterlimit="10" stroke-width="1.5" d="M3.5 9.09h17"/><path stroke-miterlimit="10" stroke-width="1.5" d="M21 8.5V17c0 3-1.5 5-5 5H8c-3.5 0-5-2-5-5V8.5c0-3 1.5-5 5-5h8c3.5 0 5 2 5 5Z"/><path stroke-width="2" d="M15.695 13.7h.009"/><path stroke-width="2" d="M15.695 16.7h.009"/><path stroke-width="2" d="M11.995 13.7h.01"/><path stroke-width="2" d="M11.995 16.7h.01"/><path stroke-width="2" d="M8.294 13.7h.01"/><path stroke-width="2" d="M8.294 16.7h.01"/></g></svg>
                    </button>
                    <button class="p-occurrence__tab" title="Actions" aria-label="Go to actions view">
                      <svg viewBox="0 0 24 24" fill="none"><g stroke="#292D32" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.75 13.25C20.75 18.08 16.83 22 12 22C7.17 22 3.25 18.08 3.25 13.25C3.25 8.42 7.17 4.5 12 4.5C16.83 4.5 20.75 8.42 20.75 13.25Z"/><path d="M12 8V13"/><path d="M9 2H15" stroke-miterlimit="10"/></g></svg>
                    </button>
                  </div>
                </div>

                <div class="p-occurrence__content">
                  <div class="c-events-view">
                    <div class="c-events-view__tools">
                      <div class="c-list-toolbar">
                        <div class="c-list-toolbar__item-wrapper"><div class="c-list-toolbar__item">
                          <button class="c-list-toolbar__btn" title="Filter">
                            <svg viewBox="0 0 24 24" fill="none"><g stroke="#292D32" stroke-width="1.5" stroke-linecap="round"><path d="M3 7H21"/><path d="M6 12H18"/><path d="M10 17H14"/></g></svg>
                            All, All
                          </button>
                        </div></div>
                        <div class="c-list-toolbar__item-wrapper"><div class="c-list-toolbar__item">
                          <button class="c-list-toolbar__btn" title="Sort">
                            <svg viewBox="0 0 24 24" fill="none"><g stroke="#292D32" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.45 6.71997L6.72998 3L3.01001 6.71997"/><path d="M6.72998 21V3"/><path d="M13.55 17.28L17.2701 21L20.9901 17.28"/><path d="M17.27 3V21"/></g></svg>
                            default
                          </button>
                        </div></div>
                        <div class="c-list-toolbar__item-wrapper"><div class="c-list-toolbar__item">
                          <button class="c-list-toolbar__btn" title="Delete">
                            <svg viewBox="0 0 24 24" fill="none"><g stroke="#292D32" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5.97998C17.67 5.64998 14.32 5.47998 10.98 5.47998C9 5.47998 7.02 5.57998 5.04 5.77998L3 5.97998"/><path d="M8.5 4.97L8.72 3.66C8.88 2.71 9 2 10.69 2H13.31C15 2 15.13 2.75 15.28 3.67L15.5 4.97"/><path d="M18.85 9.14001L18.2 19.21C18.09 20.78 18 22 15.21 22H8.79002C6.00002 22 5.91002 20.78 5.80002 19.21L5.15002 9.14001"/><path d="M10.33 16.5H13.66"/><path d="M9.5 12.5H14.5"/></g></svg>
                            <span>Delete (<span id="selected-count">0</span> selected)</span>
                          </button>
                        </div></div>
                        <div class="c-list-toolbar__item-wrapper"><div class="c-list-toolbar__item">
                          <button class="c-list-toolbar__btn" title="Set hour format">
                            <svg viewBox="0 0 24 24" fill="none"><g stroke="#00000050" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path stroke-miterlimit="10" d="M18 18.86H17.24C16.44 18.86 15.68 19.17 15.12 19.73L13.41 21.42C12.63 22.19 11.36 22.19 10.58 21.42L8.87 19.73C8.31 19.17 7.54 18.86 6.75 18.86H6C4.34 18.86 3 17.53 3 15.89V4.97998C3 3.33998 4.34 2.01001 6 2.01001H18C19.66 2.01001 21 3.33998 21 4.97998V15.89C21 17.52 19.66 18.86 18 18.86Z"/><path d="M7 9.16003C7 8.23003 7.76 7.46997 8.69 7.46997C9.62 7.46997 10.38 8.23003 10.38 9.16003C10.38 11.04 7.71 11.24 7.12 13.03C7 13.4 7.31 13.77 7.7 13.77H10.38"/><path d="M16.04 13.76V8.05003C16.04 7.79003 15.87 7.55997 15.62 7.48997C15.37 7.41997 15.1 7.51997 14.96 7.73997C14.24 8.89997 13.46 10.22 12.78 11.38C12.67 11.57 12.67 11.82 12.78 12.01C12.89 12.2 13.1 12.3199 13.33 12.3199H17"/></g></svg>
                          </button>
                        </div></div>
                      </div>
                      <button class="c-events-view__add-btn" aria-label="Add event" title="Add event">
                        <svg viewBox="0 0 24 24" fill="none"><g stroke="#292D32" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M6 12h12"/><path d="M12 18V6"/></g></svg>
                      </button>
                    </div>

                    <div class="c-events-view__cards">
                      <div class="c-occurrence-card-wrapper">
                        <article class="c-occurrence-card c-occurrence-card--Personal">
                          <div class="c-occurrence-card__content">
                            <h3 class="c-occurrence-card__title">Teste</h3>
                            <div class="c-occurrence-card__datetime">
                              <span>Wed, 14 Oct 2026 - Wed, 14 Oct 2026</span>
                              <span class="c-occurrence-card__time">12:00 AM - 12:00 AM</span>
                            </div>
                            <span class="c-occurrence-card__countdown" data-date="2026-10-14"></span>
                          </div>
                          <div class="c-occurrence-card__category-icon">
                            <svg viewBox="0 0 24 24" fill="none"><g stroke="#292D32" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z"/><path d="M20.59 22c0-3.87-3.85-7-8.59-7s-8.59 3.13-8.59 7"/></g></svg>

  <script>
    // Countdown, same rule as OccurrenceCard: calendar-day difference from today.
    const today = new Date(new Date().toISOString().slice(0, 10));
    document.querySelectorAll('.c-occurrence-card__countdown').forEach((el) => {
      const diff = Math.round((new Date(el.dataset.date) - today) / 86400000);
      if (diff < 0) el.innerHTML = 'Already <br> happened';
      else if (diff === 0) el.textContent = "It's today!!";
      else el.innerHTML = 'In <span class="c-occurrence-card__countdown--highlight">' + diff + '</span> ' + (diff === 1 ? 'day' : 'days');
    });

    // Selected count in the Delete button
    const count = document.getElementById('selected-count');
    document.querySelectorAll('.c-occurrence-card__checkbox input').forEach((cb) => {
      cb.addEventListener('click', (e) => e.stopPropagation());
      cb.addEventListener('change', () => {
        count.textContent = document.querySelectorAll('.c-occurrence-card__checkbox input:checked').length;
      });
    });

    // Tabs active state
    document.querySelectorAll('.p-occurrence__tab').forEach((tab) => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.p-occurrence__tab').forEach((t) => t.classList.remove('p-occurrence__tab--active'));
        tab.classList.add('p-occurrence__tab--active');
      });
    });
  </script>
