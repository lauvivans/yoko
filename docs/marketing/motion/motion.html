<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>Yoko motion</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../prototypes/platform/tokens.css">
<link rel="stylesheet" href="../../prototypes/platform/shell.css">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg-page);font-family:'Quicksand',sans-serif;color:var(--dark)}
  .stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg-page)}
  .layer{position:absolute;inset:0}

  /* Intro */
  .blob{position:absolute;border-radius:50%;opacity:.9}
  .intro{display:grid;place-items:center}
  .intro__group{display:grid;justify-items:center;gap:10px}
  .yoko{width:360px;height:auto}
  .title{display:flex;font-size:150px;font-weight:700;line-height:1;letter-spacing:-2px}
  .title span{display:inline-block}
  .tagline{position:relative;font-size:58px;font-weight:700}
  .tagline mark{position:relative;padding:0 14px;background:none;color:inherit}
  .tagline mark::before{content:"";position:absolute;inset:4px 0;border-radius:var(--border-r-default);background:var(--blue);z-index:-1;transform-origin:left;transform:scaleX(var(--sweep,0))}

  /* Highlights */
  .feature{position:absolute;inset:0;display:grid;justify-items:center;align-content:center;gap:40px;background:var(--bg-page)}
  .feature h2{font-size:84px;font-weight:700}
  .feature kbd{display:inline-block;padding:2px 22px;border-radius:16px;border:4px solid var(--dark);font:inherit;box-shadow:0 6px 0 var(--dark)}
  .feature__shots{position:relative;width:1240px;border-radius:22px;border:4px solid var(--dark);overflow:hidden;box-shadow:0 30px 70px rgba(26,26,26,.28)}
  .feature__shots img{display:block;width:100%}
  .feature__shots .over{position:absolute;inset:0;clip-path:inset(0 0 0 100%)}


  /* Outro */
  .outro{position:absolute;inset:0;display:grid;justify-items:center;align-content:center;gap:22px;background:#393d3f;color:#fdfdff}
  .outro .yoko{width:250px}
  .outro__title{font-size:120px;font-weight:700;line-height:1}
  .outro__line{font-size:46px;font-weight:600}
  .crew{display:flex;gap:26px;margin-top:20px}
  .crew span{display:grid;place-items:center;width:130px;height:130px;border-radius:50%;background:var(--c);border:4px solid #1a1a1a}
  .crew svg{width:100px;height:100px}
  .outro__link{margin-top:18px;padding:12px 30px;border-radius:999px;background:#fdfdff;color:#1a1a1a;font-size:36px;font-weight:700}
</style>
</head>
<body>
<div class="stage" id="stage">
  <section class="layer intro" id="intro">
    <div class="blob" style="width:520px;height:520px;left:-120px;top:-140px;background:var(--blue)"></div>
    <div class="blob" style="width:380px;height:380px;right:-80px;top:120px;background:var(--yellow)"></div>
    <div class="blob" style="width:300px;height:300px;left:180px;bottom:-90px;background:var(--bg-cat-reading)"></div>
    <div class="blob" style="width:440px;height:440px;right:220px;bottom:-200px;background:var(--bg-cat-social)"></div>
    <div class="blob" style="width:180px;height:180px;left:44%;top:60px;background:var(--bg-cat-health)"></div>
    <div class="intro__group">
      <img class="yoko" id="intro-yoko" src="../../../client/public/mascot.svg" alt="">
      <div class="title" id="title"></div>
      <p class="tagline" id="tagline">Your days, <mark id="mark">in one place.</mark></p>
    </div>
  </section>
  <div id="features"></div>
  <section class="outro" id="outro">
    <img class="yoko" id="outro-yoko" src="../../../client/public/mascot.svg" alt="">
    <h1 class="outro__title">Yoko!</h1>
    <p class="outro__line">Your days, in one place.</p>
    <div class="crew" id="crew"></div>
    <p class="outro__link">Open source · github.com/lauvivans/yoko</p>
  </section>
</div>

<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script src="../../prototypes/platform/mascots.js"></script>
<script>
  const $ = (s, root = document) => root.querySelector(s);
  const SHOTS = 'out/shots/';
  const modules = [
    { id: 'occurrences', name: 'Occurrences', line: 'Count down to what matters.', color: 'var(--blue)' },
    { id: 'places', name: 'Places', line: 'Pin the places you’ve been.', color: 'var(--yellow)' },
    { id: 'links', name: 'Links', line: 'Save it now, read it later.', color: 'var(--bg-cat-reading)' },
    { id: 'notes', name: 'Notes', line: 'Whatever is on your mind.', color: 'var(--bg-cat-study)' },
    { id: 'tasks', name: 'Tasks', line: 'Plan your day, one task at a time.', color: 'var(--bg-cat-finance)' },
    { id: 'mood', name: 'Mood', line: 'Tell Yoko how you feel.', color: 'var(--bg-cat-social)' },
    { id: 'routines', name: 'Routines', line: 'Skincare, hair schedule, any routine.', color: 'var(--bg-cat-health)' },
    { id: 'media', name: 'Media', line: 'Anime, manga, games and movies.', color: 'var(--bg-cat-work)' },
    { id: 'lists', name: 'Lists', line: 'Checklists and collections.', color: 'var(--bg-cat-home)' },
  ];

  // Build the scenes
  $('#title').innerHTML = [...'Yoko!'].map((c) => `<span>${c}</span>`).join('');
  const themes = window.YokoMascots.themes;
  $('#features').innerHTML = `
    <section class="feature" id="f-theme" style="visibility:hidden"><h2>Light or dark</h2><div class="feature__shots"><img src="${SHOTS}tasks.png" alt=""><img class="over" src="${SHOTS}dark.png" alt=""></div></section>
    <section class="feature" id="f-modules" style="visibility:hidden"><h2>Only the modules you use</h2><div class="feature__shots"><img src="${SHOTS}settings.png" alt=""></div></section>`;
  // The outro crew mixes worlds: each module brings its mascot from a different theme.
  $('#crew').innerHTML = modules.map((m, i) => `<span style="--c:${m.color}">${themes[i % themes.length].cast[m.id]}</span>`).join('');
  $('#outro').style.visibility = 'hidden';

  // One timeline, paused: the renderer seeks it frame by frame.
  const tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });
  window.tl = tl;

  // 1. Intro (0–4.6s)
  tl.from('.blob', { scale: 0, duration: 1, stagger: 0.08, ease: 'back.out(1.6)' }, 0)
    .to('.blob', { y: (i) => (i % 2 ? 30 : -30), x: (i) => (i % 3 ? 20 : -20), duration: 4.4, ease: 'sine.inOut' }, 0.4)
    .from('#intro-yoko', { scale: 0, rotation: -60, y: 120, duration: 1.4, ease: 'elastic.out(1, 0.5)' }, 0.2)
    .to('#intro-yoko', { rotation: -8, y: -10, duration: 0.5, ease: 'sine.inOut', yoyo: true, repeat: 5 }, 1.5)
    .from('#title span', { y: 160, opacity: 0, rotation: (i) => (i % 2 ? 12 : -12), duration: 0.8, stagger: 0.07, ease: 'back.out(2.2)' }, 0.9)
    .from('#tagline', { y: 40, opacity: 0, duration: 0.7 }, 1.8)
    .to('#mark', { '--sweep': 1, duration: 0.7, ease: 'power2.inOut' }, 2.3)
    .to('#intro .intro__group', { scale: 0.9, opacity: 0, duration: 0.5, ease: 'power2.in' }, 4.1);

  // 2. Highlights
  const feature = (id, at, extra) => {
    tl.set(`#${id}`, { visibility: 'visible' }, at)
      .from(`#${id} h2`, { y: 60, opacity: 0, duration: 0.5 }, at)
      .from(`#${id} .feature__shots`, { y: 300, rotation: 4, opacity: 0, duration: 0.8, ease: 'power4.out' }, at + 0.1);
    if (extra) extra(at);
    tl.set(`#${id}`, { visibility: 'hidden' }, at + 1.9);
  };
  // Right after the intro, the renderer inserts the live clips of the platform, then goes on with the highlights.
  const introEnd = 4.6;
  window.cut = introEnd;

  feature('f-theme', introEnd, (at) => tl.to('#f-theme .over', { clipPath: 'inset(0 0 0 0%)', duration: 0.9, ease: 'power2.inOut' }, at + 0.8));
  feature('f-modules', introEnd + 1.9);

  // 3. Outro: the crew does a wave around Yoko
  const outroAt = introEnd + 3.8;
  tl.set('#outro', { visibility: 'visible' }, outroAt)
    .fromTo('#outro', { clipPath: 'circle(0% at 50% 50%)' }, { clipPath: 'circle(150% at 50% 50%)', duration: 0.7, ease: 'power3.inOut' }, outroAt)
    .from('#outro-yoko', { scale: 0, rotation: 40, duration: 1, ease: 'elastic.out(1, 0.55)' }, outroAt + 0.3)
    .from('.outro__title', { y: 60, opacity: 0, duration: 0.5 }, outroAt + 0.5)
    .from('.outro__line', { y: 40, opacity: 0, duration: 0.5 }, outroAt + 0.65)
    .from('#crew span', { y: 260, opacity: 0, duration: 0.7, stagger: 0.07, ease: 'back.out(1.8)' }, outroAt + 0.8)
    .to('#crew span', { y: -26, duration: 0.25, stagger: 0.07, yoyo: true, repeat: 1, ease: 'sine.out' }, outroAt + 1.9)
    .to('#crew span', { y: -26, duration: 0.25, stagger: 0.07, yoyo: true, repeat: 1, ease: 'sine.out' }, outroAt + 3)
    .from('.outro__link', { scale: 0.6, opacity: 0, duration: 0.5, ease: 'back.out(2)' }, outroAt + 1.5)
    .to('#outro-yoko', { rotation: -10, duration: 0.6, yoyo: true, repeat: 3, ease: 'sine.inOut' }, outroAt + 1.4)
    .to({}, { duration: 1 }, outroAt + 4);
  window.motionReady = document.fonts.ready.then(() => Promise.all([...document.images].map((img) => img.decode().catch(() => {}))));
</script>
</body>
</html>
