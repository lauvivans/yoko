<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Yoko — Mood history</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="components.css">
  <style>
    .p-mood{display:grid;gap:14px;padding:16px 12px 40px}
    .p-mood h1{font-size:var(--text-lg);font-weight:var(--font-bold)}
    .p-mood__day h2{margin:6px 0 8px;font-size:var(--text-xs);font-weight:var(--font-bold);letter-spacing:.04em;text-transform:uppercase;color:var(--text-color-muted)}
    .p-mood__entries{display:grid;gap:8px;list-style:none;padding:0;margin:0}

    /* Entries can't be edited (product requirements), so a card only shows and can be selected for deletion */
    .c-mood-entry{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:start;gap:12px;padding:12px 14px;border-radius:var(--border-r-default);border:var(--border-w-default) solid var(--border-color-line);background:var(--bg-surface)}
    .c-mood-entry:has(input:checked){box-shadow:0 0 0 2px var(--text-color-default)}
    .c-mood-entry__emoji{font-size:var(--text-xl);line-height:1}
    .c-mood-entry__text{display:grid;gap:2px}
    .c-mood-entry__feeling{font-size:var(--text-base);font-weight:var(--font-regular)}
    .c-mood-entry__feeling b{font-weight:var(--font-bold)}
    .c-mood-entry__why{font-size:var(--text-sm)}
    .c-mood-entry__time{font-size:var(--text-xs);color:var(--text-color-muted)}
    .c-mood-entry input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--text-color-default);cursor:pointer}

    .c-popover input[type="month"],.c-popover input[type="date"]{padding:7px 10px;border-radius:var(--border-r-default);border:var(--border-w-default) solid var(--border-color-line);background:var(--bg-surface-raised);color:var(--text-color-default);font:inherit;font-size:var(--text-sm)}
    [data-theme="dark"] .c-popover input{color-scheme:dark}
    .p-mood__message{display:flex;flex-direction:column;align-items:center;gap:10px;padding:32px 0;text-align:center;color:var(--text-color-muted);font-size:var(--text-sm);font-weight:var(--font-highlight)}
    .p-mood__message img{width:140px;height:auto;transform:rotate(-8deg)}

    @media (min-width:769px){
      .p-mood{padding:22px 24px 40px}
    }
  </style>
</head>
<body data-page="mood" data-search="Search moods">
  <div class="app">
    <div class="app__main">
      <main class="app__content">
        <div class="p-mood">
          <h1>Mood history</h1>
          <div class="c-list-toolbar">
            <div class="c-dropdown">
              <button class="c-list-toolbar__btn" type="button" id="filter-toggle" aria-expanded="false" aria-controls="filter-popover">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M3 7h18M6 12h12M10 17h4"/></svg>
                <span id="filter-label">All time</span>
              </button>
              <div class="c-popover" id="filter-popover" hidden>
                <h2 id="period-title">Show</h2>
                <div class="c-popover__chips" role="group" aria-labelledby="period-title" id="period-options"></div>
                <label class="c-field" id="month-field" hidden><span>Month</span><input type="month" id="month"></label>
                <label class="c-field" id="day-field" hidden><span>Day</span><input type="date" id="day"></label>
              </div>
            </div>
            <button class="c-list-toolbar__btn c-list-toolbar__btn--danger" type="button" id="delete" aria-disabled="true">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M21 5.98c-3.33-.33-6.68-.5-10.02-.5-1.98 0-3.96.1-5.94.3L3 5.98M8.5 4.97l.22-1.31C8.88 2.71 9 2 10.69 2h2.62c1.69 0 1.82.75 1.97 1.67l.22 1.3M18.85 9.14l-.65 10.07C18.09 20.78 18 22 15.21 22H8.79C6 22 5.91 20.78 5.8 19.21L5.15 9.14M10.33 16.5h3.33M9.5 12.5h5"/></svg>
              <span>Delete (<span id="selected-count">0</span> selected)</span>
            </button>
          </div>
          <div id="history"></div>
          <div class="p-mood__message" id="message" hidden>
            <img src="../../../client/public/mascot.svg" alt="">
            <p id="message-text"></p>
          </div>
        </div>
      </main>
    </div>
  </div>

  <dialog class="c-dialog c-confirm" id="delete-dialog" aria-labelledby="delete-title">
    <form method="dialog">
      <div class="c-dialog__head">
        <h2 id="delete-title">Are you sure you want to delete <b id="delete-count">1 entry</b>?</h2>
        <button class="c-icon-btn" value="cancel" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <p class="c-confirm__note">This can’t be undone.</p>
      <div class="c-dialog__actions">
        <button class="c-button c-button--ghost" value="cancel">Cancel</button>
        <button class="c-button c-button--danger" value="delete">Delete</button>
      </div>
    </form>
  </dialog>

  <script src="shell.js"></script>
  <script src="components.js"></script>
  <script>
    (() => {
      const { escapeHtml, closeOnBackdrop, dropdowns, renderChips } = window.YokoUI;
      const $ = (id) => document.getElementById(id);
      const emojis = { Happy: '😊', Excited: '🤩', Grateful: '🥰', Calm: '😌', Curious: '🤔', Tired: '😴', Anxious: '😰', Sad: '😢' };
      const at = (daysAgo, time) => {
        const [h, m] = time.split(':').map(Number);
        const d = new Date();
        d.setDate(d.getDate() - daysAgo);
        d.setHours(h, m, 0, 0);
        return d;
      };
      let nextId = 1;
      const entry = (daysAgo, time, mood, why = '') => ({ id: nextId++, date: at(daysAgo, time), mood, why });
      const entries = [
        entry(0, '08:10', 'Calm', 'Slept well and had a slow breakfast.'),
        entry(0, '17:45', 'Tired', 'Long day of meetings.'),
        entry(1, '21:30', 'Grateful', 'Dinner with Mom for her birthday.'),
        entry(2, '09:00', 'Anxious', 'Exam in a few weeks.'),
        entry(4, '19:20', 'Happy', 'Finished the Places prototype.'),
        entry(9, '12:00', 'Curious'),
        entry(16, '10:30', 'Excited', 'Booked the trip to Lisbon.'),
        entry(35, '22:00', 'Sad', 'Missing home.'),
        entry(48, '08:00', 'Happy', 'Got my driver’s license.'),
      ];

      // Filter by month or by day (product requirements)
      const periodOptions = [
        { id: 'all', label: 'All time' },
        { id: 'month', label: 'A month' },
        { id: 'day', label: 'A day' },
      ];
      let period = 'all';
      let query = '';
      const pad = (n) => String(n).padStart(2, '0');
      const today = new Date();
      $('month').value = `${today.getFullYear()}-${pad(today.getMonth() + 1)}`;
      $('day').value = `${$('month').value}-${pad(today.getDate())}`;
      const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

      const matches = (e) => {
        if (query && !`${e.mood} ${e.why}`.toLowerCase().includes(query)) return false;
        if (period === 'month') return ymd(e.date).startsWith($('month').value);
        if (period === 'day') return ymd(e.date) === $('day').value;
        return true;
      };

      const history = $('history');
      const popovers = dropdowns(['filter']);

      const render = () => {
        const visible = entries.filter(matches).sort((a, b) => b.date - a.date);
        const days = new Map();
        visible.forEach((e) => {
          const key = e.date.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
          days.set(key, [...(days.get(key) ?? []), e]);
        });
        history.innerHTML = [...days]
          .map(
            ([day, items]) => `<section class="p-mood__day"><h2>${day}</h2><ul class="p-mood__entries">${items
              .map(
                (e) => `<li class="c-mood-entry">
                  <span class="c-mood-entry__emoji" aria-hidden="true">${emojis[e.mood]}</span>
                  <div class="c-mood-entry__text">
                    <span class="c-mood-entry__feeling">I was feeling <b>${e.mood}</b></span>
                    ${e.why ? `<span class="c-mood-entry__why">${escapeHtml(e.why)}</span>` : ''}
                    <span class="c-mood-entry__time">${e.date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })}</span>
                  </div>
                  <input type="checkbox" value="${e.id}" aria-label="Select ${e.mood} on ${day}">
                </li>`,
              )
              .join('')}</ul></section>`,
          )
          .join('');
        updateSelection();
        $('message').hidden = visible.length > 0;
        $('message-text').textContent = entries.length === 0 ? 'No moods yet. Tell Yoko how you feel from the top bar.' : 'No moods for this period.';

        renderChips($('period-options'), periodOptions, period, (id) => {
          period = id;
          render();
        });
        $('month-field').hidden = period !== 'month';
        $('day-field').hidden = period !== 'day';
        const label = period === 'month' ? new Date(`${$('month').value}-01T12:00`).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' })
          : period === 'day' ? new Date(`${$('day').value}T12:00`).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })
          : 'All time';
        $('filter-label').textContent = label;
        $('filter-toggle').classList.toggle('is-active', period !== 'all');
      };

      const updateSelection = () => {
        const selected = history.querySelectorAll('input:checked').length;
        $('selected-count').textContent = selected;
        $('delete').setAttribute('aria-disabled', String(selected === 0));
      };
      history.addEventListener('change', updateSelection);
      $('month').addEventListener('change', render);
      $('day').addEventListener('change', render);

      const deleteDialog = $('delete-dialog');
      closeOnBackdrop(deleteDialog);
      $('delete').addEventListener('click', () => {
        const selected = history.querySelectorAll('input:checked').length;
        if (selected === 0) return;
        $('delete-count').textContent = `${selected} ${selected === 1 ? 'entry' : 'entries'}`;
        deleteDialog.returnValue = '';
        deleteDialog.showModal();
      });
      deleteDialog.addEventListener('close', () => {
        if (deleteDialog.returnValue !== 'delete') return;
        history.querySelectorAll('input:checked').forEach((input) => entries.splice(entries.findIndex((e) => e.id === Number(input.value)), 1));
        render();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') popovers.closeOpen();
      });
      $('search').addEventListener('input', (e) => {
        query = e.target.value.trim().toLowerCase();
        render();
      });

      render();
    })();
  </script>
</body>
</html>
