<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Yoko — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="components.css">
  <style>
    /* Signed-out pages have no shell: just the card in the middle of the page */
    body{display:grid;place-items:center;padding:96px 16px 24px}
    .c-auth{position:relative;display:grid;gap:14px;width:min(360px,100%);padding:44px 20px 24px;border-radius:var(--border-r-default);border:var(--border-w-default) solid var(--border-color-dark);background:var(--bg-default);color:var(--text-color-on-color);text-align:center;box-shadow:var(--shadow-lg)}
    .c-auth__mascot{position:absolute;left:50%;top:-74px;width:104px;height:auto;transform:translateX(-30%) rotate(-8deg)}
    .c-auth h1{font-size:var(--text-lg);font-weight:var(--font-bold);line-height:1.2}
    .c-auth__lead{font-size:var(--text-sm)}
    .c-auth form{display:grid;gap:10px;text-align:left}
    .c-auth .c-field span{color:var(--text-color-on-color)}
    .c-auth .c-field input{background:var(--gray);color:var(--dark-md);border-color:var(--border-color-dark)}
    .c-auth .c-button{justify-content:center}
    .c-auth__or{display:flex;align-items:center;gap:10px;font-size:var(--text-xs);font-weight:var(--font-highlight)}
    .c-auth__or::before,.c-auth__or::after{content:'';flex:1;height:1px;background:var(--border-color-dark);opacity:var(--opacity-soft)}
    .c-auth__google{background:var(--gray);color:var(--dark-md);border:var(--border-w-default) solid var(--border-color-dark)}
    .c-auth__google svg{width:18px;height:18px}
    .c-auth__links{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;font-size:var(--text-xs)}
    .c-auth__links button,.c-auth__links a{all:unset;font-weight:var(--font-bold);text-decoration:underline;cursor:pointer;color:inherit}
    .c-auth__links button:focus-visible,.c-auth__links a:focus-visible{outline:2px solid var(--dark);outline-offset:2px}
    .c-auth__error{font-size:var(--text-xs);font-weight:var(--font-bold);color:var(--dark)}
    .c-auth__error::before{content:'⚠ '}
    .c-auth__spinner{justify-self:center;width:28px;height:28px;border-radius:var(--border-r-full);border:3px solid rgba(26,26,26,.2);border-top-color:var(--dark);animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){.c-auth__spinner{animation:none}}
    .c-auth__note{max-width:360px;font-size:var(--text-xs);color:var(--text-color-muted);text-align:center}

    @media (min-width:481px){
      .c-auth{padding:48px 32px 28px}
    }
  </style>
</head>
<body>
  <main>
    <!-- Step 1: choose how to sign in -->
    <section class="c-auth" id="step-start" aria-labelledby="start-title">
      <img class="c-auth__mascot" src="../../../client/public/mascot.svg" alt="">
      <h1 id="start-title">Yoko welcomes you</h1>
      <p class="c-auth__lead">Your events, actions, tasks and notes, in one place.</p>
      <form id="email-form" novalidate>
        <label class="c-field"><span>Email</span><input type="email" name="email" autocomplete="email" placeholder="you@example.com" required aria-describedby="email-error"></label>
        <p class="c-auth__error" id="email-error" hidden></p>
        <button class="c-button" type="submit">Send me a sign-in link</button>
      </form>
      <p class="c-auth__or">or</p>
      <button class="c-button c-auth__google" type="button" id="google">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21.6 12.23c0-.7-.06-1.37-.18-2.02H12v3.82h5.39a4.6 4.6 0 0 1-2 3.02v2.5h3.24c1.9-1.75 2.97-4.33 2.97-7.32Z"/><path fill="currentColor" d="M12 22c2.7 0 4.97-.9 6.63-2.43l-3.24-2.51c-.9.6-2.04.96-3.39.96-2.6 0-4.81-1.76-5.6-4.12H3.06v2.59A10 10 0 0 0 12 22Z" opacity=".75"/><path fill="currentColor" d="M6.4 13.9a6 6 0 0 1 0-3.8V7.51H3.06a10 10 0 0 0 0 8.98L6.4 13.9Z" opacity=".55"/><path fill="currentColor" d="M12 5.98c1.47 0 2.79.5 3.83 1.5l2.87-2.87A9.6 9.6 0 0 0 12 2a10 10 0 0 0-8.94 5.51L6.4 10.1C7.19 7.74 9.4 5.98 12 5.98Z" opacity=".4"/></svg>
        Continue with Google
      </button>
    </section>

    <!-- Step 2: the link was sent -->
    <section class="c-auth" id="step-sent" aria-labelledby="sent-title" hidden>
      <img class="c-auth__mascot" src="../../../client/public/mascot.svg" alt="">
      <h1 id="sent-title" tabindex="-1">Check your email</h1>
      <p class="c-auth__lead">We sent a sign-in link to <b id="sent-email"></b>. It works for 15 minutes.</p>
      <button class="c-button" type="button" id="open-link">Open the link</button>
      <div class="c-auth__links">
        <button type="button" id="resend">Resend the link</button>
        <button type="button" id="change-email">Use another email</button>
      </div>
      <p class="c-auth__lead" id="resent" role="status"></p>
    </section>

    <!-- Step 3: signed in, going to the app -->
    <section class="c-auth" id="step-done" aria-labelledby="done-title" hidden>
      <img class="c-auth__mascot" src="../../../client/public/mascot.svg" alt="">
      <h1 id="done-title" tabindex="-1">Yay! You’re signed in</h1>
      <p class="c-auth__lead" role="status">Taking you to Yoko…</p>
      <span class="c-auth__spinner" aria-hidden="true"></span>
    </section>
  </main>
  <p class="c-auth__note">Prototype: “Open the link” stands in for clicking the link in the email.</p>

  <script>
    (() => {
      // Theme chosen in the app, when the browser allows reading it.
      try {
        const saved = localStorage.getItem('yoko-prototype-theme');
        if (saved) document.documentElement.dataset.theme = saved;
      } catch {
        // Storage blocked: keep the light theme.
      }

      const $ = (id) => document.getElementById(id);
      const steps = ['start', 'sent', 'done'];
      const show = (step) => {
        steps.forEach((s) => ($(`step-${s}`).hidden = s !== step));
        document.querySelector(`#step-${step} h1`).focus?.();
      };

      const form = $('email-form');
      const email = form.elements.namedItem('email');
      const error = $('email-error');
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const value = email.value.trim();
        const message = !value ? 'Type your email.' : !email.checkValidity() ? 'This doesn’t look like an email. Check it and try again.' : '';
        error.textContent = message;
        error.hidden = !message;
        email.setAttribute('aria-invalid', String(Boolean(message)));
        if (message) {
          email.focus();
          return;
        }
        $('sent-email').textContent = value;
        $('resent').textContent = '';
        show('sent');
      });
      email.addEventListener('input', () => {
        error.hidden = true;
        email.removeAttribute('aria-invalid');
      });

      // The delay stands in for the redirect, so the signed-in state can be seen.
      const redirectDelay = 1800;
      const signIn = () => {
        show('done');
        setTimeout(() => (window.location.href = 'home.html'), redirectDelay);
      };
      $('open-link').addEventListener('click', signIn);
      $('google').addEventListener('click', signIn);
      $('resend').addEventListener('click', () => ($('resent').textContent = 'Sent again. Check your spam folder too.'));
      $('change-email').addEventListener('click', () => {
        show('start');
        email.focus();
      });
    })();
  </script>
</body>
</html>
