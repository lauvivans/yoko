<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Yoko — Places</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="components.css">
  <style>
    .p-places{position:absolute;inset:0;overflow:hidden}
    /* Illustrated map, not a real one: an SVG that pans and zooms */
    .c-fakemap{position:absolute;inset:0;z-index:0;overflow:hidden;background:var(--map-land);cursor:grab;touch-action:none;user-select:none}
    .c-fakemap.is-dragging{cursor:grabbing}
    .c-fakemap__layer{position:absolute;transform-origin:0 0;transition:transform .2s}
    .c-fakemap.is-dragging .c-fakemap__layer{transition:none}
    .c-fakemap__art{position:absolute;inset:0;width:100%;height:100%}
    .c-fakemap__art text{font-family:'Quicksand',sans-serif;font-weight:var(--font-bold);fill:var(--map-label);letter-spacing:.02em}
    .c-fakemap__art .is-water{fill:#4a90c2;font-style:italic;font-weight:var(--font-highlight)}
    [data-theme="dark"] .c-fakemap__art .is-water{fill:#7fb3d6}
    .c-fakemap__zoom{position:absolute;left:14px;top:66px;display:none;flex-direction:column;border-radius:var(--border-r-default);overflow:hidden;border:1px solid var(--border-color-line);box-shadow:0 4px 12px rgba(0,0,0,.18);z-index:500}
    .c-fakemap__zoom button{all:unset;display:grid;place-items:center;width:34px;height:34px;background:var(--bg-surface);color:var(--text-color-default);font-size:var(--text-lg);font-weight:var(--font-bold);cursor:pointer}
    .c-fakemap__zoom button + button{border-top:1px solid var(--border-color-line)}
    .c-fakemap__zoom button:hover{background:var(--bg-surface-raised)}
    .c-fakemap__zoom button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
    .c-fakemap__note{position:absolute;left:14px;bottom:10px;padding:2px 8px;border-radius:var(--border-r-soft);font-size:var(--text-xs);font-weight:var(--font-highlight);background:var(--bg-surface);color:var(--text-color-muted);opacity:.85;z-index:500}

    .p-places__toolbar{position:absolute;top:10px;left:10px;right:10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;z-index:500;pointer-events:none}
    .p-places__toolbar > *{pointer-events:auto;box-shadow:0 4px 12px rgba(0,0,0,.18)}
    .c-filter{all:unset;padding:6px 12px;border-radius:var(--border-r-pill);font-size:var(--text-xs);font-weight:var(--font-bold);cursor:pointer;background:var(--bg-surface);color:var(--text-color-default);border:1px solid var(--border-color-line)}
    .c-filter.is-active{background:var(--filter-color,var(--bg-surface-raised));color:var(--dark-md);border-color:var(--dark-md)}
    .c-filter:focus-visible{outline:2px solid var(--accent)}
    .p-places__count{display:none;margin-left:auto;padding:6px 12px;border-radius:var(--border-r-pill);font-size:var(--text-xs);font-weight:var(--font-highlight);background:var(--bg-surface);color:var(--text-color-muted);border:1px solid var(--border-color-line)}

    /* Place card */
    .c-place{position:absolute;left:8px;right:8px;bottom:8px;max-height:62%;display:flex;flex-direction:column;border-radius:var(--border-r-default);background:var(--bg-surface);color:var(--text-color-default);box-shadow:var(--shadow-lg);border:1px solid var(--border-color-line);overflow:hidden;z-index:600}
    .c-place__gallery{position:relative;flex-shrink:0}
    .c-place__photo{all:unset;box-sizing:border-box;width:100%;height:140px;display:flex;cursor:zoom-in;align-items:flex-end;padding:12px;color:#fff;font-weight:var(--font-bold);font-size:var(--text-xs);text-shadow:0 1px 4px rgba(0,0,0,.4);background-size:cover}
    .c-place__close{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.35);color:#fff}
    .c-place__close:hover{background:rgba(0,0,0,.5)}
    .c-place__thumbs{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;border-bottom:1px solid var(--border-color-line)}
    .c-thumb{all:unset;flex-shrink:0;width:52px;height:40px;border-radius:var(--border-r-soft);cursor:pointer;background-size:cover;border:2px solid transparent}
    .c-thumb.is-selected{border-color:var(--text-color-default)}
    .c-thumb:focus-visible{outline:2px solid var(--accent)}
    .c-thumb--add{display:grid;place-items:center;background:var(--bg-surface-raised);border:1px dashed var(--text-color-muted);color:var(--text-color-muted)}
    .c-thumb--add svg{width:20px;height:20px}
    .c-place__body{display:flex;flex-direction:column;gap:12px;padding:16px;overflow-y:auto}
    .c-place__header{display:flex;align-items:flex-start;gap:10px}
    .c-place__title{font-size:var(--text-lg);font-weight:var(--font-bold);line-height:1.2}
    .c-place__where{font-size:var(--text-sm);color:var(--text-color-muted)}
    .c-place__fav{all:unset;margin-left:auto;display:grid;place-items:center;width:36px;height:36px;border-radius:var(--border-r-default);cursor:pointer;color:var(--text-color-default)}
    .c-place__fav:hover{background:var(--bg-surface-raised)}
    .c-place__fav:focus-visible{outline:2px solid var(--accent)}
    .c-place__fav svg{width:22px;height:22px}
    .c-place__fav.is-on svg path{fill:var(--red);stroke:var(--red)}
    .c-place__meta{display:flex;flex-wrap:wrap;gap:8px}
    .c-place__note{font-size:var(--text-sm);line-height:1.6}
    .c-place__actions{display:flex;gap:8px;margin-top:auto;padding:12px 16px;border-top:1px solid var(--border-color-line)}
    .c-place__actions .c-button{flex:1;justify-content:center}

    .c-tag--button{border:0;font-family:inherit;cursor:pointer}
    .c-tag--button:hover{background:var(--bg-surface)}
    .c-tag--button:focus-visible{outline:2px solid var(--accent)}
    .c-tag--button:disabled{cursor:default}
    .c-place__photo:disabled{cursor:default}
    .c-place__photo:focus-visible{outline:2px solid var(--accent);outline-offset:-4px}

    /* Picking the spot of a new place */
    .c-pick{position:absolute;left:50%;bottom:16px;translate:-50% 0;z-index:600;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;width:max-content;max-width:calc(100% - 20px);padding:8px 8px 8px 16px;border-radius:var(--border-r-pill);background:var(--bg-shell);color:var(--text-color-shell);font-size:var(--text-sm);font-weight:var(--font-highlight);box-shadow:var(--shadow-md)}
    .c-pick .c-button--ghost{background:transparent;color:var(--text-color-shell);border-color:var(--border-color-shell)}
    .is-picking .c-fakemap{cursor:crosshair}
    .c-pin.is-draft{border-style:dashed}

    /* Photos inside the place form */
    .c-photos{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
    .c-photos__item{position:relative;width:72px;height:56px;border-radius:var(--border-r-soft);background-size:cover;background-position:center}
    .c-photos__remove{all:unset;position:absolute;top:-6px;right:-6px;display:grid;place-items:center;width:22px;height:22px;border-radius:var(--border-r-full);background:var(--bg-shell);color:var(--text-color-shell);cursor:pointer}
    .c-photos__remove svg{width:14px;height:14px}
    .c-photos__remove:focus-visible{outline:2px solid var(--accent)}
    .c-photos__add{display:grid;place-items:center;width:72px;height:56px;border-radius:var(--border-r-soft);border:1px dashed var(--text-color-muted);background:var(--bg-surface-raised);color:var(--text-color-muted);cursor:pointer}
    .c-photos__add svg{width:20px;height:20px}
    .c-photos__add:focus-within{outline:2px solid var(--accent)}
    .c-dialog__delete{margin-right:auto}
    .c-button:disabled{opacity:var(--opacity-md);cursor:default}

    /* Add photos */
    .c-dropzone{display:grid;justify-items:center;gap:4px;padding:24px 16px;border-radius:var(--border-r-default);border:var(--border-w-highlight) dashed var(--border-color-line);text-align:center;font-size:var(--text-sm);cursor:pointer}
    .c-dropzone svg{width:32px;height:32px;color:var(--text-color-muted)}
    .c-dropzone span{font-size:var(--text-xs);color:var(--text-color-muted)}
    .c-dropzone:hover,.c-dropzone.is-over{border-color:var(--text-color-default);background:var(--bg-surface-raised)}
    .c-dropzone:focus-within{outline:2px solid var(--accent)}
    .c-uploads{display:grid;gap:8px;max-height:40vh;margin:0;padding:0;overflow-y:auto;list-style:none}
    .c-uploads:empty{display:none}
    .c-upload{position:relative;display:grid;grid-template-columns:56px 1fr;align-items:center;gap:10px;padding-right:20px}
    .c-upload__preview{height:44px;border-radius:var(--border-r-soft);background-size:cover;background-position:center}
    .c-upload__caption{min-width:0;padding:7px 10px;border-radius:var(--border-r-default);border:1px solid var(--border-color-line);background:var(--bg-surface-raised);color:var(--text-color-default);font:inherit;font-size:var(--text-sm)}
    .c-upload__caption:focus-visible{outline:2px solid var(--accent)}
    .c-upload .c-photos__remove{top:50%;right:-4px;translate:0 -50%}

    /* Gallery: a pinboard of photos with their own heights */
    .c-gallery{width:100%;max-width:100%;height:100%;max-height:100%;margin:0;padding:0;border:0;background:var(--bg-page);color:var(--text-color-default)}
    .c-gallery[open]{display:flex;flex-direction:column}
    .c-gallery__head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px}
    .c-gallery__head h2{font-size:var(--text-lg);font-weight:var(--font-bold)}
    .c-gallery__head h2 b{font-weight:inherit}
    .c-gallery__head p{font-size:var(--text-xs);color:var(--text-color-muted)}
    .c-gallery__head .c-icon-btn:hover{background:var(--bg-surface-raised)}
    /* CSS columns give the pinboard layout: grid can't pack items of different heights yet, so items space themselves */
    .c-gallery__wall{flex:1;columns:2 150px;column-gap:12px;margin:0;padding:0 16px 24px;list-style:none;overflow-y:auto}
    .c-gallery__wall li{break-inside:avoid;margin-bottom:16px}
    .c-gallery__item{all:unset;display:grid;gap:4px;width:100%;cursor:zoom-in}
    .c-gallery__item:focus-visible .c-gallery__photo{outline:3px solid var(--accent);outline-offset:2px}
    .c-gallery__photo{display:block;aspect-ratio:var(--ratio);border-radius:var(--border-r-default);background-size:cover;background-position:center;transition:transform var(--duration-default) var(--ease-out),box-shadow var(--duration-default)}
    .c-gallery__item:hover .c-gallery__photo{transform:translateY(-3px);box-shadow:var(--shadow-md)}
    .c-gallery__caption{font-size:var(--text-sm);font-weight:var(--font-bold)}
    .c-gallery__place{font-size:var(--text-xs);color:var(--text-color-muted)}

    /* Viewer: one photo in full screen */
    .c-viewer{width:100%;max-width:100%;height:100%;max-height:100%;margin:0;padding:0;border:0;background:var(--bg-shell);color:var(--text-color-shell)}
    .c-viewer[open]{display:grid;grid-template-rows:1fr auto}
    .c-viewer::backdrop{background:var(--bg-shell)}
    .c-viewer .c-icon-btn{color:var(--text-color-shell)}
    .c-viewer .c-icon-btn:hover{background:var(--bg-shell-hover)}
    .c-viewer__close{position:absolute;top:10px;right:10px;z-index:1}
    .c-viewer__stage{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px;min-height:0;padding:56px 4px 0;touch-action:pan-y}
    .c-viewer__photo{grid-column:2;justify-self:center;width:min(100%,calc((100vh - 160px) * var(--ratio)));aspect-ratio:var(--ratio);border-radius:var(--border-r-default);background-size:cover;background-position:center}
    #viewer-prev{grid-column:1;grid-row:1}
    #viewer-next{grid-column:3;grid-row:1}
    .c-viewer__info{display:grid;justify-items:center;gap:2px;padding:14px 16px 20px;text-align:center;font-size:var(--text-sm)}
    .c-viewer__info span{color:var(--text-color-shell-muted)}
    .c-viewer__count{font-size:var(--text-xs)}
    @media (prefers-reduced-motion:no-preference){
      .c-viewer__photo.is-next{animation:slide-in var(--duration-default) var(--ease-out)}
      .c-viewer__photo.is-prev{animation:slide-in-back var(--duration-default) var(--ease-out)}
    }
    @keyframes slide-in{from{opacity:0;transform:translateX(40px)}}
    @keyframes slide-in-back{from{opacity:0;transform:translateX(-40px)}}

    @media (min-width:769px){
      .c-pick{top:66px;bottom:auto}
      .c-gallery__wall{columns:4 200px;column-gap:16px;padding:0 24px 32px}
      .c-gallery__head{padding:18px 24px}
      .c-viewer__stage{gap:16px;padding:56px 16px 0}
      .p-places__toolbar{top:14px;left:14px;right:14px}
      .p-places__count{display:block}
      .c-fakemap__zoom{display:flex}
      .c-place{top:66px;left:auto;right:14px;bottom:14px;width:340px;max-height:none}
      .c-place__photo{height:190px}
    }
  </style>
</head>
<body data-page="places" data-search="Search places">
  <div class="app">
    <div class="app__main">
      <main class="app__content">
        <div class="p-places" id="places-root">
          <div class="c-fakemap" id="map" aria-label="Map of the places you have been to (illustration)">
            <div class="c-fakemap__layer" id="map-layer">
              <svg class="c-fakemap__art" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
                <g fill="var(--map-block)">
                  <rect x="40" y="250" width="120" height="70" rx="10"/><rect x="420" y="90" width="150" height="80" rx="10"/><rect x="600" y="140" width="110" height="90" rx="10"/>
                  <rect x="380" y="300" width="170" height="110" rx="10"/><rect x="620" y="300" width="130" height="90" rx="10"/><rect x="820" y="300" width="140" height="100" rx="10"/>
                  <rect x="80" y="600" width="160" height="70" rx="10"/><rect x="420" y="590" width="150" height="80" rx="10"/><rect x="860" y="60" width="110" height="80" rx="10"/>
                </g>
                <g fill="var(--map-park)">
                  <ellipse cx="180" cy="130" rx="62" ry="42"/>
                  <path d="M230 170c40-30 140-25 170 15s5 105-55 115-150-5-150-50 5-55 35-80Z"/>
                  <path d="M60 400c40-25 190-25 220 5s-10 60-90 62-150-2-155-30 0-25 25-37Z"/>
                  <ellipse cx="840" cy="210" rx="78" ry="48"/>
                  <ellipse cx="800" cy="610" rx="70" ry="44"/>
                </g>
                <g fill="none" stroke-linecap="round">
                  <g stroke="var(--map-road-edge)" stroke-width="16">
                    <path d="M-20 230C200 215 420 205 700 215s220 20 340 30"/><path d="M500 -20C495 140 490 330 470 470"/>
                    <path d="M-20 330C260 330 520 340 1020 350"/><path d="M720 -20c-15 150-40 330-70 520"/><path d="M180 -20c40 160 90 330 120 720"/>
                  </g>
                  <g stroke="var(--map-road)" stroke-width="11">
                    <path d="M-20 230C200 215 420 205 700 215s220 20 340 30"/><path d="M500 -20C495 140 490 330 470 470"/>
                    <path d="M-20 330C260 330 520 340 1020 350"/><path d="M720 -20c-15 150-40 330-70 520"/><path d="M180 -20c40 160 90 330 120 720"/>
                  </g>
                  <g stroke="var(--map-road)" stroke-width="5">
                    <path d="M40 60h360M560 60c120 10 260 30 460 30M380 410c-60 40-140 90-400 120M560 420c60 60 160 120 460 160"/>
                    <path d="M330 260c20 60 30 120 30 200M600 240c30 50 40 120 30 210M880 90c-10 90-30 170-60 240"/>
                    <path d="M520 470l-20 240M640 520l40 190M240 560c120 0 200 10 260 40"/>
                  </g>
                </g>
                <path d="M-30 505C120 520 240 575 380 540s180-110 300-70 170 120 360 60" fill="none" stroke="var(--map-water)" stroke-width="44" stroke-linecap="round"/>
                <g fill="none" stroke="var(--map-road-edge)" stroke-width="7"><path d="M470 455v95M650 470v95"/></g>
                <g font-size="17">
                  <text x="150" y="85">Camden</text><text x="440" y="75">King's Cross</text><text x="660" y="120">Shoreditch</text>
                  <text x="270" y="210">Regent's Park</text><text x="120" y="440">Hyde Park</text><text x="420" y="390">The City</text>
                  <text x="520" y="640">Southwark</text><text x="190" y="640">Westminster</text><text x="800" y="200">Victoria Park</text>
                  <text class="is-water" x="590" y="500" font-size="16">River Thames</text>
                </g>
              </svg>
              <div id="pins"></div>
            </div>
          </div>
          <div class="c-fakemap__zoom">
            <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
            <button type="button" id="zoom-out" aria-label="Zoom out">&minus;</button>
          </div>
          <span class="c-fakemap__note">Illustrative map, not to scale</span>

          <div class="c-pick" id="pick" role="status" hidden>
            <span>Tap the map where you went</span>
            <button class="c-button c-button--module" type="button" id="pick-center">Pin at map center</button>
            <button class="c-button c-button--ghost" type="button" id="pick-cancel">Cancel</button>
          </div>

          <div class="p-places__toolbar">
            <span class="c-module" id="module-badge"><span>Places</span></span>
            <button class="c-button c-button--module" type="button" id="add-place" data-new>
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>
              Add place
            </button>
            <button class="c-button c-button--ghost" type="button" id="open-gallery">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><g stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 22h6c5 0 7-2 7-7V9c0-5-2-7-7-7H9C4 2 2 4 2 9v6c0 5 2 7 7 7Z"/><path d="M9 10a2 2 0 1 0 0-4 2 2 0 0 0 0 4ZM2.67 18.95l4.93-3.31c.79-.53 1.93-.47 2.64.14l.33.29c.78.67 2.04.67 2.82 0l4.16-3.57c.78-.67 2.04-.67 2.82 0L22 13.9"/></g></svg>
              Gallery
            </button>
            <div id="filters" style="display:contents"></div>
            <span class="p-places__count" id="count"></span>
          </div>

          <article class="c-place" id="place" aria-live="polite">
            <div class="c-place__gallery">
              <button class="c-place__photo" type="button" id="photo"></button>
              <button class="c-icon-btn c-place__close" type="button" id="close" aria-label="Close place">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="m7 7 10 10M17 7 7 17"/></svg>
              </button>
            </div>
            <div class="c-place__thumbs" id="thumbs"></div>
            <div class="c-place__body">
              <div class="c-place__header">
                <div>
                  <h1 class="c-place__title" id="title"></h1>
                  <p class="c-place__where" id="where"></p>
                </div>
                <button class="c-place__fav" type="button" id="fav" aria-label="Favorite" aria-pressed="false">
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M12.62 20.81c-.34.12-.9.12-1.24 0C8.48 19.82 2 15.69 2 8.69 2 5.6 4.49 3.1 7.56 3.1c1.82 0 3.43.88 4.44 2.24a5.53 5.53 0 0 1 4.44-2.24C19.51 3.1 22 5.6 22 8.69c0 7-6.48 11.13-9.38 12.12Z"/></svg>
                </button>
              </div>
              <div class="c-place__meta" id="meta"></div>
              <p class="c-place__note" id="note"></p>
            </div>
            <div class="c-place__actions">
              <button class="c-button c-button--ghost" type="button" id="edit-place">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><g stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m13.26 3.6-8.21 8.69c-.31.33-.61.98-.67 1.43l-.37 3.24c-.13 1.17.71 1.97 1.87 1.77l3.22-.55c.45-.08 1.08-.41 1.39-.75l8.21-8.69c1.42-1.5 2.06-3.21-.15-5.3-2.2-2.07-3.87-1.34-5.29.16Z"/><path d="M11.89 5.05a6.126 6.126 0 0 0 5.45 5.15M3 22h18"/></g></svg>
                Edit
              </button>
              <button class="c-button c-button--module" type="button" id="add-photos">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><g stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 10a2 2 0 1 0 0-4 2 2 0 0 0 0 4ZM13 2H9C4 2 2 4 2 9v6c0 5 2 7 7 7h6c5 0 7-2 7-7v-5M15.75 5h5.5M18.5 7.75v-5.5M2.67 18.95l4.93-3.31c.79-.53 1.93-.47 2.64.14l.33.29c.78.67 2.04.67 2.82 0l4.16-3.57c.78-.67 2.04-.67 2.82 0L22 13.9"/></g></svg>
                Add photos
              </button>
            </div>
          </article>
        </div>
      </main>
    </div>
  </div>

  <dialog class="c-dialog" id="place-dialog" aria-labelledby="place-form-title">
    <form class="c-form" id="place-form" novalidate>
      <div class="c-dialog__head">
        <h2 id="place-form-title">New place</h2>
        <button class="c-icon-btn" type="button" id="close-place-form" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <label class="u-visually-hidden" for="place-title">Name</label>
      <input class="c-dialog__title" id="place-title" name="title" placeholder="Name this place" maxlength="60" autocomplete="off" required>
      <label class="c-field"><span>Where</span><input name="where" placeholder="Neighborhood, city" maxlength="80" autocomplete="off"></label>
      <div class="c-dialog__row">
        <label class="c-field"><span>Category</span><select class="c-select__native" name="category"></select></label>
        <label class="c-field"><span>Visited on</span><input type="date" name="visited" required></label>
      </div>
      <label class="c-field"><span>Note</span><textarea name="note" rows="3" maxlength="500" placeholder="What do you want to remember?"></textarea></label>
      <div class="c-field" role="group" aria-labelledby="form-photos-label">
        <span id="form-photos-label">Photos</span>
        <ul class="c-photos" id="form-photos">
          <li>
            <label class="c-photos__add" id="form-photos-add">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>
              <span class="u-visually-hidden">Add photos</span>
              <input class="u-visually-hidden" type="file" id="form-photos-input" accept="image/*" multiple>
            </label>
          </li>
        </ul>
      </div>
      <label class="c-dialog__check"><input type="checkbox" name="fav"> Favorite</label>
      <div class="c-dialog__actions">
        <button class="c-button c-button--danger c-dialog__delete" type="button" id="delete-place">Delete</button>
        <button class="c-button c-button--ghost" type="button" id="cancel-place">Cancel</button>
        <button class="c-button c-button--module" type="submit" id="submit-place">Create</button>
      </div>
    </form>
  </dialog>

  <dialog class="c-dialog c-confirm" id="delete-dialog" aria-labelledby="delete-title">
    <form method="dialog">
      <div class="c-dialog__head">
        <h2 id="delete-title">Are you sure you want to delete <b id="delete-name"></b>?</h2>
        <button class="c-icon-btn" value="cancel" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <p class="c-confirm__note">Its photos go with it. This can’t be undone.</p>
      <div class="c-dialog__actions">
        <button class="c-button c-button--ghost" value="cancel">Cancel</button>
        <button class="c-button c-button--danger" value="delete">Delete</button>
      </div>
    </form>
  </dialog>

  <dialog class="c-dialog" id="photos-dialog" aria-labelledby="photos-title">
    <form class="c-form" id="photos-form" novalidate>
      <div class="c-dialog__head">
        <h2 id="photos-title">Add photos</h2>
        <button class="c-icon-btn" type="button" id="close-photos" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <label class="c-dropzone" id="dropzone">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><g stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 10a2 2 0 1 0 0-4 2 2 0 0 0 0 4ZM13 2H9C4 2 2 4 2 9v6c0 5 2 7 7 7h6c5 0 7-2 7-7v-5M15.75 5h5.5M18.5 7.75v-5.5M2.67 18.95l4.93-3.31c.79-.53 1.93-.47 2.64.14l.33.29c.78.67 2.04.67 2.82 0l4.16-3.57c.78-.67 2.04-.67 2.82 0L22 13.9"/></g></svg>
        <strong>Drop photos here</strong>
        <span>or click to choose them</span>
        <input class="u-visually-hidden" type="file" id="photo-files" accept="image/*" multiple>
      </label>
      <ul class="c-uploads" id="uploads" aria-label="Photos to add"></ul>
      <div class="c-dialog__actions">
        <button class="c-button c-button--ghost" type="button" id="cancel-photos">Cancel</button>
        <button class="c-button c-button--module" type="submit" id="submit-photos" disabled>Add photos</button>
      </div>
    </form>
  </dialog>

  <dialog class="c-gallery" id="gallery" aria-labelledby="gallery-title">
    <div class="c-gallery__head">
      <div>
        <h2 id="gallery-title">All photos</h2>
        <p id="gallery-count"></p>
      </div>
      <button class="c-icon-btn" type="button" id="close-gallery" aria-label="Close gallery">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <ul class="c-gallery__wall" id="gallery-wall"></ul>
  </dialog>

  <dialog class="c-viewer" id="viewer" aria-label="Photo viewer">
    <button class="c-icon-btn c-viewer__close" type="button" id="close-viewer" aria-label="Close photo">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <div class="c-viewer__stage" id="viewer-stage">
      <button class="c-icon-btn c-viewer__nav" type="button" id="viewer-prev" aria-label="Previous photo">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M15 19.92 8.48 13.4c-.77-.77-.77-2.03 0-2.8L15 4.08"/></svg>
      </button>
      <div class="c-viewer__photo" id="viewer-photo" role="img"></div>
      <button class="c-icon-btn c-viewer__nav" type="button" id="viewer-next" aria-label="Next photo">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="m8.91 19.92 6.52-6.52c.77-.77.77-2.03 0-2.8L8.91 4.08"/></svg>
      </button>
    </div>
    <div class="c-viewer__info" aria-live="polite">
      <strong id="viewer-caption"></strong>
      <span id="viewer-place"></span>
      <span class="c-viewer__count" id="viewer-count"></span>
    </div>
  </dialog>

  <script src="mascots.js"></script>
  <script src="shell.js"></script>
  <script src="select.js"></script>
  <script src="components.js"></script>
  <script src="places.js"></script>
</body>
</html>
